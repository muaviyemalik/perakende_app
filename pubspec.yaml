name: perakende_app
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.5.3
  mobile_scanner: ^7.4.0
  flutter_dotenv: ^5.1.0
  intl: ^0.20.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  image_path: "assets/asil_logo.png"
  android: true
  ios: true